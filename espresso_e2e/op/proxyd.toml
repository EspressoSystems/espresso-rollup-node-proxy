[server]
rpc_host = "0.0.0.0"
rpc_port = 8545
# set to 0 to disable WebSocket
ws_port = 0

[metrics]
enabled = false

[backend]
response_timeout_seconds = 5
max_response_size_bytes = 5242880
max_retries = 3
out_of_service_seconds = 60

[backends.fullnode1]
rpc_url = "http://fullnode-proxy-1:8080"
consensus_receipts_target = "eth_getBlockReceipts"
consensus_skip_peer_count = true

[backends.fullnode2]
rpc_url = "http://fullnode-proxy-2:8080"
consensus_receipts_target = "eth_getBlockReceipts"
consensus_skip_peer_count = true

[backends.fullnode3]
rpc_url = "http://fullnode-proxy-3:8080"
consensus_receipts_target = "eth_getBlockReceipts"
consensus_skip_peer_count = true

[backend_groups.main]
backends = ["fullnode1", "fullnode2", "fullnode3"]
routing_strategy = "consensus_aware"
consensus_min_peer_count = 0
consensus_espresso_tag = "espresso"

[rpc_method_mappings]
eth_blockNumber = "main"
eth_call = "main"
eth_chainId = "main"
eth_estimateGas = "main"
eth_feeHistory = "main"
eth_gasPrice = "main"
eth_getBalance = "main"
eth_getBlockByHash = "main"
eth_getBlockByNumber = "main"
eth_getBlockReceipts = "main"
eth_getBlockTransactionCountByHash = "main"
eth_getBlockTransactionCountByNumber = "main"
eth_getCode = "main"
eth_getLogs = "main"
eth_getProof = "main"
eth_getStorageAt = "main"
eth_getTransactionByBlockHashAndIndex = "main"
eth_getTransactionByBlockNumberAndIndex = "main"
eth_getTransactionByHash = "main"
eth_getTransactionCount = "main"
eth_getTransactionReceipt = "main"
eth_getUncleByBlockHashAndIndex = "main"
eth_getUncleByBlockNumberAndIndex = "main"
eth_getUncleCountByBlockHash = "main"
eth_getUncleCountByBlockNumber = "main"
eth_getHeaderByHash = "main"
eth_getHeaderByNumber = "main"
eth_accounts = "main"
eth_maxPriorityFeePerGas = "main"
eth_sendRawTransaction = "main"
eth_subscribe = "main"
eth_syncing = "main"
net_listening = "main"
net_peerCount = "main"
net_version = "main"
web3_clientVersion = "main"
web3_sha3 = "main"
