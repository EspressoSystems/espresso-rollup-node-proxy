services:
  l1-data-init:
    image: busybox
    command: >
      sh -c '
        mkdir -p /l1-config
        mkdir -p /data/lighthouse-validator /data/lighthouse-beacon
        chown -R ${U_ID:-1000}:${GID:-1000} /l1-config /data
      '
    volumes:
      - l1-config:/l1-config
      - l1-data:/data

  l1-genesis:
    platform: linux/amd64
    user: ${U_ID:-1000}:${GID:-1000}
    restart: on-failure
    depends_on:
      l1-data-init:
        condition: service_completed_successfully
    image: ${L1_GETH_IMAGE}
    environment:
      - MODE=genesis
    volumes:
      - l1-config:/config
      - l1-data:/data
      - ./l1-config:/deployment/l1-config:ro

  l1-geth:
    depends_on:
      l1-genesis:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${L1_HTTP_PORT}"]
      interval: 3s
      timeout: 2s
      retries: 40
    image: ${L1_GETH_IMAGE}
    environment:
      L1_HTTP_PORT: ${L1_HTTP_PORT}
      L1_ENGINE_PORT: ${L1_ENGINE_PORT}
      L1_CHAIN_ID: ${L1_CHAIN_ID}
    volumes:
      - l1-config:/config:ro
      - l1-data:/data
    ports:
      - "${L1_HTTP_PORT}:${L1_HTTP_PORT}"
      - "${L1_ENGINE_PORT}:${L1_ENGINE_PORT}"

  mock-l1-beacon:
    build:
      context: ../
      dockerfile: mock-l1-beacon/Dockerfile
    depends_on:
      l1-geth:
        condition: service_healthy
    volumes:
      - l1-config:/config:ro
    ports:
      - "${L1_BEACON_PORT}:${L1_BEACON_PORT}"
    command:
      - --engine=http://l1-geth:${L1_ENGINE_PORT}
      - --eth=http://l1-geth:${L1_HTTP_PORT}
      - --jwt=/config/jwt.txt
      - --block-time=1s
      - --finalized-distance=20
      - --safe-distance=10
      - --addr=0.0.0.0:${L1_BEACON_PORT}

  l1-validator:
    image: ${LIGHTHOUSE_IMAGE}
    depends_on:
      l1-genesis:
        condition: service_completed_successfully
      l1-geth:
        condition: service_started
      mock-l1-beacon:
        condition: service_started
    volumes:
      - l1-data:/data
      - l1-config:/config:ro
    command:
      - lighthouse
      - validator_client
      - --testnet-dir
      - /config
      - --beacon-nodes
      - http://mock-l1-beacon:${L1_BEACON_PORT}
      - --init-slashing-protection
      - --datadir
      - /data/lighthouse-validator
      - --suggested-fee-recipient
      - ${OPERATOR_ADDRESS}
      
  espresso-dev-node:
    image: ${ESPRESSO_DEV_NODE_IMAGE}
    depends_on:
      l1-geth:
        condition: service_healthy
    ports:
      - "${ESPRESSO_SEQUENCER_API_PORT}:${ESPRESSO_SEQUENCER_API_PORT}"
      - "${ESPRESSO_DEV_NODE_PORT}:${ESPRESSO_DEV_NODE_PORT}"
      - "${ESPRESSO_BUILDER_PORT}:${ESPRESSO_BUILDER_PORT}"
    volumes:
      - espresso-data:/data
    env_file:
      - ./.env
    environment:
      RUST_LOG: warn
      ESPRESSO_DEV_NODE_L1_DEPLOYMENT: skip
      RUST_BACKTRACE: 1
      ESPRESSO_SEQUENCER_STORAGE_PATH: /data/espresso
      ESPRESSO_SEQUENCER_L1_PROVIDER: http://l1-geth:${L1_HTTP_PORT}
      ESPRESSO_DEPLOYER_ACCOUNT_INDEX: 0
      ESPRESSO_DEV_NODE_EPOCH_HEIGHT: "4294967295"
      ESPRESSO_SEQUENCER_ETH_MNEMONIC: "giant issue aisle success illegal bike spike question tent bar rely arctic volcano long crawl hungry vocal artwork sniff fantasy very lucky have athlete"

  tx-generator:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    depends_on:
      nitro:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          cast send \
            --rpc-url http://nitro:8547 \
            --private-key 0xb6b15c8cb491557369f3c7d2c287b053eb229daa9c22138887752191c9520659 \
            0x3f1Eae7D46d88F08fc2F8ed27FCb2AB183EB2d0E \
            --value 0 2>&1 || true
          sleep 2
        done

  rollup-creator:
    image: ghcr.io/espressosystems/timeboost/rollup-creator:rpc
    volumes:
      - "config:/config"
      - "./nitro-config:/nitro-config"
    environment:
      AUTHORIZE_VALIDATORS: 10
      CHAIN_DEPLOYMENT_INFO: "/config/deployment.json"
      CHILD_CHAIN_CONFIG_PATH: "/nitro-config/l2_chain_config.json"
      CHILD_CHAIN_INFO: "/config/deployed_chain_info.json"
      CHILD_CHAIN_NAME: "arb-dev-test"
      DEPLOYER_PRIVKEY: ${OPERATOR_PRIVATE_KEY}
      MAX_DATA_SIZE: 117964
      OWNER_ADDRESS: 0x3f1Eae7D46d88F08fc2F8ed27FCb2AB183EB2d0E
      PARENT_CHAIN_ID: ${L1_CHAIN_ID}
      PARENT_CHAIN_RPC: http://l1-geth:${L1_HTTP_PORT}
      SEQUENCER_ADDRESS: 0x3f1Eae7D46d88F08fc2F8ed27FCb2AB183EB2d0E
      WASM_MODULE_ROOT: 0xdb698a2576298f25448bc092e52cf13b1e24141c997135d70f217d674bbeb69a
    command: ["create-rollup-testnode"]
    depends_on:
      l1-geth:
        condition: service_healthy

  nitro:
    image: ghcr.io/espressosystems/nitro-espresso-integration/nitro-node:integration-v3.9.8
    entrypoint: /usr/local/bin/nitro
    ports:
      - "8547:8547"
      - "8548:8548"
      - "9642:9642"
    volumes:
      - "nitro:/home/user/.arbitrum/local/nitro"
      - "l1keystore:/home/user/l1keystore"
      - "config:/config"
      - "./nitro-config:/nitro-config"
    command:
      - --conf.file=/nitro-config/nitro_config.json
      - --parent-chain.connection.url=http://l1-geth:${L1_HTTP_PORT}
      - --node.feed.output.enable
      - --node.feed.output.port=9642
      - --http.api=net,web3,eth,txpool,debug,timeboost,auctioneer,batcher
      - --node.seq-coordinator.my-url=http://nitro:8547
      - --graphql.enable
      - --graphql.vhosts=*
      - --graphql.corsdomain=*
    depends_on:
      rollup-creator:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-s",
          "-X",
          "POST",
          "--data",
          '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}',
          "-H",
          "Content-Type: application/json",
          "http://localhost:8547",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  l1-config:
  l1-data:
  config:
  l1keystore:
  espresso-data:
  nitro: