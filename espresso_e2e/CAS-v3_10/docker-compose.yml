services:
  l1-anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      [
        "--host",
        "0.0.0.0",
        "--block-time",
        "1",
        "--chain-id",
        "1337",
        "--load-state",
        "/state/l1-state.json",
        "--slots-in-an-epoch",
        "1",
      ]
    volumes:
      - "./${CONFIG_DIR:-generated-config}:/state:ro"
    ports:
      - "8545:8545"
    healthcheck:
      test:
        ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 2s
      timeout: 2s
      retries: 10

  espresso-dev-node:
    image: ${ESPRESSO_DEV_NODE_IMAGE}
    ports:
      - "${ESPRESSO_SEQUENCER_API_PORT}:${ESPRESSO_SEQUENCER_API_PORT}"
      - "${ESPRESSO_DEV_NODE_PORT}:${ESPRESSO_DEV_NODE_PORT}"
      - "${ESPRESSO_BUILDER_PORT}:${ESPRESSO_BUILDER_PORT}"
    volumes:
      - espresso-data:/data
    environment:
      ESPRESSO_BUILDER_PORT: ${ESPRESSO_BUILDER_PORT}
      ESPRESSO_DEPLOYER_ACCOUNT_INDEX: ${ESPRESSO_DEPLOYER_ACCOUNT_INDEX}
      ESPRESSO_DEV_NODE_PORT: ${ESPRESSO_DEV_NODE_PORT}
      ESPRESSO_SEQUENCER_API_PORT: ${ESPRESSO_SEQUENCER_API_PORT}
      ESPRESSO_SEQUENCER_ETH_MNEMONIC: ${ESPRESSO_SEQUENCER_ETH_MNEMONIC}
      ESPRESSO_SEQUENCER_DATABASE_MAX_CONNECTIONS: 25
      ESPRESSO_DEV_NODE_EPOCH_HEIGHT: ${ESPRESSO_DEV_NODE_EPOCH_HEIGHT}
      ESPRESSO_SEQUENCER_STORAGE_PATH: /data/espresso
      ESPRESSO_DEV_NODE_L1_DEPLOYMENT: skip
      ESPRESSO_SEQUENCER_LIGHT_CLIENT_PROXY_ADDRESS: "0x0f1f89aaf1c6fdb7ff9d361e4388f5f3997f12a8"
      ESPRESSO_SEQUENCER_STAKE_TABLE_ADDRESS: "0x63e6dde6763c3466c7b45be880f7ee5dc2ca3e25"
      ESPRESSO_SEQUENCER_STAKE_TABLE_PROXY_ADDRESS: "0x9f5eac3d8e082f47631f1551f1343f23cd427162"
      RUST_LOG: warn
      ESPRESSO_DEV_NODE_VERSION: "0.4"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:${ESPRESSO_SEQUENCER_API_PORT}/healthcheck",
        ]
      interval: 3s
      timeout: 2s
      retries: 30

  sequencer:
    image: ${NITRO_IMAGE}
    platform: linux/amd64
    entrypoint: /usr/local/bin/nitro
    ports:
      - "8547:8547"
      - "8548:8548"
      - "9642:9642"
    volumes:
      - "nitro-sequencer:/home/user/.arbitrum/local/nitro"
      - "l1keystore:/home/user/l1keystore"
      - "./${CONFIG_DIR:-generated-config}:/config"
      - "./nitro-config:/nitro-config"
    command:
      - --conf.file=/nitro-config/sequencer_config.json
      - --node.batch-poster.enable=false
      - --node.batch-poster.parent-chain-wallet.private-key=${BATCH_POSTER_PRIVATE_KEY}
      - --node.staker.enable=false
      - --execution.sequencer.enable=true
      - --node.feed.output.signed=true
      - --http.api=net,web3,eth,txpool,debug
      - --node.seq-coordinator.my-url=http://sequencer:8547
      - --node.da.anytrust.enable=true
      - --node.da.anytrust.rest-aggregator.enable=true
      - --node.da.anytrust.rest-aggregator.urls=http://das-mirror:9877
    depends_on:
      l1-anvil:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-X",
          "POST",
          "--data",
          '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
          "-H",
          "Content-Type: application/json",
          "http://localhost:8547",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # Chain Adjacent Service (v3.10 build) from a container image. See header note
  # for building it. Config is committed at ./cas-config/config.json.
  cas:
    image: ${CAS_IMAGE:-ghcr.io/espressosystems/chain-adjacent-service:main-v3_10}
    platform: linux/amd64
    environment:
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY}
      RUST_LOG: ${CAS_RUST_LOG:-warn}
    volumes:
      - "./cas-config:/etc/cas:ro"
    ports:
      - "8000:8000"
    depends_on:
      l1-anvil:
        condition: service_healthy
      espresso-dev-node:
        condition: service_healthy
      sequencer:
        condition: service_healthy

  poster:
    image: ${NITRO_IMAGE}
    platform: linux/amd64
    entrypoint: /usr/local/bin/nitro
    volumes:
      - "nitro-poster:/home/user/.arbitrum/local/nitro"
      - "l1keystore:/home/user/l1keystore"
      - "./${CONFIG_DIR:-generated-config}:/config"
      - "./nitro-config:/nitro-config"
    command:
      - --conf.file=/nitro-config/poster_config.json
      - --node.batch-poster.parent-chain-wallet.private-key=${BATCH_POSTER_PRIVATE_KEY}
      - --node.da.external-provider.enable=true
      - --node.da.external-provider.with-writer=true
      - --node.da.external-provider.rpc.url=${CAS_CALLDATA_RPC_URL}
      - --node.feed.input.url=${CAS_FEED_URL}
      - --node.dangerous.no-sequencer-coordinator=true
      - --node.da.anytrust.enable=true
      - --node.da.anytrust.rpc-aggregator.enable=true
      - --node.da.anytrust.rpc-aggregator.assumed-honest=1
      - --node.da.anytrust.rest-aggregator.enable=true
      - --node.da.anytrust.rest-aggregator.urls=http://das-mirror:9877
    depends_on:
      sequencer:
        condition: service_healthy

  full-node:
    image: ${NITRO_IMAGE}
    platform: linux/amd64
    entrypoint: /usr/local/bin/nitro
    ports:
      - "8549:8547"
      - "8550:8548"
      - "9643:9642"
    volumes:
      - "nitro-full-node:/home/user/.arbitrum/local/nitro"
      - "./${CONFIG_DIR:-generated-config}:/config"
      - "./nitro-config:/nitro-config"
    command:
      - --conf.file=/nitro-config/full_node_config.json
      - --http.api=net,web3,eth,debug
      - --node.da.anytrust.enable=true
      - --node.da.anytrust.rest-aggregator.enable=true
      - --node.da.anytrust.rest-aggregator.urls=http://das-mirror:9877
    depends_on:
      sequencer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "-X",
          "POST",
          "--data",
          '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
          "-H",
          "Content-Type: application/json",
          "http://localhost:8547",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  tx-generator:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    depends_on:
      sequencer:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          cast send \
            --rpc-url http://sequencer:8547 \
            --private-key ${BATCH_POSTER_PRIVATE_KEY} \
            ${DEPLOYER_ADDRESS} \
            --value 1 2>&1 || true
          sleep 2
        done

volumes:
  l1keystore:
  espresso-data:
  nitro-sequencer:
  nitro-poster:
  nitro-full-node:
